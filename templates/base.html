<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MovieHub helps you discover your next favourite film."
    />
    <title>{% block title %}MovieHub{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('home') }}"
          ><span class="brand-mark" aria-hidden="true">M</span>MovieHub</a
        ><button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          data-menu-toggle
        >
          <span></span><span></span><span></span>
        </button>
        <div class="nav-area">
          <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a
            ><a href="{{ url_for('movies') }}">Movies</a
            ><a href="{{ url_for('shows') }}">Shows</a
            ><a href="{{ url_for('scraped_movies') }}">Browse</a>
          </div>
          <form
            class="nav-search"
            action="{{ url_for('search') }}"
            method="get"
            role="search"
          >
            <label class="sr-only" for="nav-search-input">Search movies</label
            ><input
              id="nav-search-input"
              name="q"
              type="search"
              placeholder="Search movies or shows"
            /><button type="submit" aria-label="Search">⌕</button>
          </form>
        </div>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">
      <div>
        <a class="brand" href="{{ url_for('home') }}"
          ><span class="brand-mark" aria-hidden="true">M</span>MovieHub</a
        >
        <p>Curated stories for every mood, all in one place.</p>
      </div>
      <div class="footer-links">
        <a href="{{ url_for('home') }}">Home</a
        ><a href="{{ url_for('movies') }}">Movies</a
        ><a href="{{ url_for('shows') }}">Shows</a
        ><a href="{{ url_for('scraped_movies') }}">Browse</a>
      </div>
      <p class="copyright">© {{ current_year }} MovieHub. Student project.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
